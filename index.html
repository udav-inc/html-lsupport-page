<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadAnvil — Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 560px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: #1F4E79;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 18px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #1F4E79;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s;
      cursor: pointer;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .card-icon.email { background: #EFF6FF; }
    .card-icon.web   { background: #F0FDF4; }
    .card-icon.app   { background: #FFF7ED; }
    .card-title { font-size: 13px; color: #999; margin-bottom: 3px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .card-value { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .card-value a { color: #2E75B6; text-decoration: none; }
    .divider {
      height: 1px; background: #eee;
      margin: 24px 0;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .badge-row {
      display: flex; gap: 10px; margin-bottom: 24px;
    }
    .badge {
      background: #1F4E79;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .badge.green { background: #16A34A; }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo">
      <div class="logo-icon">L</div>
      <div class="logo-name">LoadAnvil</div>
    </div>

    <h1>How can we help?</h1>
    <p class="subtitle">We typically respond within 24 hours.<br>Our support team is available Monday – Friday.</p>

    <div class="section-title">Contact Us</div>

    <a class="card" href="mailto:stan+support@loadanvil.com">
      <div class="card-icon email">📧</div>
      <div>
        <div class="card-title">Email Support</div>
        <div class="card-value">stan+support@loadanvil.com</div>
      </div>
    </a>

    <a class="card" href="https://support.loadanvil.com" target="_blank">
      <div class="card-icon web">🌐</div>
      <div>
        <div class="card-title">Website</div>
        <div class="card-value">support.loadanvil.com</div>
      </div>
    </a>

    <div class="divider"></div>


    <footer>© 2025 LoadAnvil. All rights reserved.</footer>
  </div>
</body>
</html>
